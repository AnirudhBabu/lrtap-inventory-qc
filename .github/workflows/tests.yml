name: tests

on:
  push:
  pull_request:

jobs:
  utplsql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: astral-sh/setup-uv@v6

      - name: Check the QC07 fixture expectations independently
        run: uv run docs/qc07_fixture_check.py

      - name: Run the utPLSQL and JUnit suites against Oracle Database Free
        run: scripts/run_tests.sh

      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.xml
            service/target/surefire-reports/
            service/target/failsafe-reports/
          if-no-files-found: ignore
